<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf2f8;
        }

        .container {
            width: 350px;
            min-height: 100vh;
            padding: 40px;
            background-color: white;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="button"] {
            padding: 11px;
            border: none;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        input[type="button"]:hover {
            background-color: #2980b9;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #f4f6f7;
            border-radius: 6px;
            color: #2c3e50;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Arithmetic Operations</h1>

        <form>
            <input type="number" id="num1" placeholder="Enter the first number">
            <input type="number" id="num2" placeholder="Enter the second number">
            <br><br>

            <input type="button" py-click="adding_number" value="Add">
            <input type="button" py-click="subtracting_number" value="Subtract">
            <input type="button" py-click="multiplying_number" value="Multiply">
            <input type="button" py-click="dividing_number" value="Divide">
        </form>

        <div id="result"></div>

    </div>

    <py-script src="main.py"></py-script>

</body>

</html>
