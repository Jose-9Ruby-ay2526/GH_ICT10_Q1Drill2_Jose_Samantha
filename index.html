
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Club Checker</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: "Trebuchet MS", sans-serif;
            background-color: #fff0f3;
            color: #59464c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            background-color: #f5aebe;
            padding: 22px 12px;
            margin-bottom: 25px;
            border-radius: 14px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
            color: white;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #fff4f6;
        }

        .card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(221, 160, 170, 0.15);
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9c6876;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1.5px solid #f8dce3;
            border-radius: 10px;
            font-size: 14px;
            color: #59464c;
            background-color: #fffbfc;
            outline: none;
        }

        input:focus {
            border-color: #e9a5b5;
        }

        input::placeholder {
            color: #c5aab2;
        }

        button {
            width: 100%;
            background-color: #e9a5b5;
            color: white;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #d98da2;
        }

        .result-box {
            margin-top: 22px;
            padding: 18px;
            min-height: 45px;
            background-color: #fff0f3;
            border: 1px solid #f8dce3;
            border-radius: 12px;
            font-size: 13px;
            color: #9c6876;
            line-height: 1.7;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #b99ca4;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>ICT Club Checker</h1>
            <p>Membership Registration System</p>
        </div>

        <div class="card">

            <div class="field-group">
                <label class="field-label" for="first_name">FIRST NAME</label>
                <input type="text" id="first_name" placeholder="Enter first name">
            </div>

            <div class="field-group">
                <label class="field-label" for="last_name">LAST NAME</label>
                <input type="text" id="last_name" placeholder="Enter last name">
            </div>

            <button py-click="check_member">Check Membership</button>

            <div class="result-box" id="result">
                Your membership result will appear here.
            </div>

        </div>

        <div class="footer">
            Made with love ♡ for ICT Club
        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
