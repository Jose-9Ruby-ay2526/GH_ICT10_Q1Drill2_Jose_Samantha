
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Club Checker</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: "Trebuchet MS", sans-serif;
            background: #100e12;
            color: #f5d65e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .light {
            width: 38px;
            height: 38px;
            background: #00eaff;
            border-radius: 50%;
            margin: 0 auto 25px;
            box-shadow: 0 0 12px #00eaff,
                        0 0 25px #00eaff,
                        0 0 40px #f5d65e;
        }

        h1 {
            color: #f5c928;
            font-size: 30px;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(245, 201, 40, 0.4);
        }

        .subtitle {
            color: #a99b9b;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        .card {
            background: #202025;
            padding: 25px;
            border: 2px solid #8d782d;
            border-top: 4px solid #a20e30;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(245, 201, 40, 0.12);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 14px;
            background: #0c0d11;
            border: 1px solid #292a30;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #e3bd38;
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: linear-gradient(#c20e35, #8e0928);
            border: 2px solid #d2aa35;
            border-radius: 6px;
            color: #f8d75a;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
        }

        button:hover {
            background: #e01642;
        }

        .result-box {
            margin-top: 20px;
            padding: 18px;
            min-height: 25px;
            background: #191d20;
            border-left: 5px solid #00dce5;
            border-radius: 5px;
            color: #f5d65e;
            font-size: 13px;
            line-height: 1.7;
            box-shadow: 0 0 15px rgba(0, 220, 229, 0.08);
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background: #a00c30;
            border-top: 3px solid #d4b13d;
            color: #e5b8c3;
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 23px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="light"></div>

        <h1>ICT CLUB CHECKER</h1>
        <div class="subtitle">MEMBERSHIP REGISTRATION SYSTEM</div>

        <div class="card">

            <input
                type="text"
                id="first_name"
                placeholder="First Name"
            >

            <input
                type="text"
                id="last_name"
                placeholder="Last Name"
            >

            <button py-click="check_member">ENTER</button>

        </div>

        <div class="result-box" id="result">
            Your membership result will appear here.
        </div>

    </div>

    <footer>
        © 2026 ICT Club • Second Quarter
    </footer>

    <script type="py" src="./main.py"></script>

</body>
</html>
