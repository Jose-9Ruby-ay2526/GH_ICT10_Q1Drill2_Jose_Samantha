
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Club Checker</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: "Trebuchet MS", sans-serif;
            background: #fff0f3;
            color: #59464c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #d98da2;
            font-size: 27px;
            margin-bottom: 6px;
        }

        .header p {
            color: #b58a97;
            font-size: 13px;
            margin: 0;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(221, 160, 170, 0.15);
        }

        .field-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: bold;
            color: #9c6876;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1.5px solid #f8dce3;
            border-radius: 10px;
            background: #fffbfc;
            color: #59464c;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #e9a5b5;
        }

        input::placeholder {
            color: #c5aab2;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: #e9a5b5;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d98da2;
        }

        .result-box {
            margin-top: 20px;
            padding: 18px;
            min-height: 35px;
            background: #fff0f3;
            border: 1px solid #f8dce3;
            border-radius: 12px;
            color: #9c6876;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #c49aa6;
            font-size: 11px;
        }

        @media (max-width: 450px) {
            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>ICT Club Checker</h1>
            <p>Membership Registration System</p>
        </div>

        <div class="card">

            <div class="field-group">
                <label for="first_name">FIRST NAME</label>
                <input
                    type="text"
                    id="first_name"
                    placeholder="Enter your first name"
                >
            </div>

            <div class="field-group">
                <label for="last_name">LAST NAME</label>
                <input
                    type="text"
                    id="last_name"
                    placeholder="Enter your last name"
                >
            </div>

            <button py-click="check_member">Check Membership</button>

            <div class="result-box" id="result">
                Your membership result will appear here.
            </div>

        </div>

        <div class="footer">
            Made with love ♡ for ICT Club
        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
